<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EAL Progress Hub</title>
<meta name="description" content="Whole-school EAL student progress and reading-age tracker">
<style>
:root{--bg:#f4f7f6;--panel:#fff;--ink:#15332c;--muted:#66756f;--brand:#176b55;--brand2:#0f8a67;--soft:#e8f5f0;--line:#dce7e2;--warn:#a66300;--danger:#a33434;--ok:#1a7a55;--shadow:0 8px 28px rgba(20,58,47,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
aside{background:#103d33;color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 22px}.logo{width:40px;height:40px;border-radius:13px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:900}.brand h1{font-size:17px;margin:0}.brand small{display:block;opacity:.72;margin-top:3px}
.nav button{width:100%;border:0;background:transparent;color:#dceee8;text-align:left;border-radius:10px;padding:10px 12px;margin:2px 0;display:flex;gap:10px;align-items:center}.nav button:hover,.nav button.active{background:rgba(255,255,255,.12);color:#fff}.nav .sep{height:1px;background:rgba(255,255,255,.12);margin:12px 8px}.aside-foot{margin-top:20px;padding:12px;border-radius:12px;background:rgba(255,255,255,.08);font-size:12px;line-height:1.45}
main{min-width:0}.topbar{position:sticky;top:0;z-index:10;background:rgba(244,247,246,.95);backdrop-filter:blur(8px);display:flex;gap:12px;align-items:center;padding:15px 22px;border-bottom:1px solid var(--line)}.topbar .search{flex:1;position:relative}.topbar input{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 14px}.topbar select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px}
.content{padding:22px;max-width:1500px;margin:auto}.page-head{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.page-head h2{margin:0;font-size:25px}.page-head p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);font-weight:650}.btn:hover{border-color:#b9d4ca}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.soft{background:var(--soft);border-color:#cde7dd;color:var(--brand)}.btn.danger{background:#fff2f2;border-color:#f1cccc;color:var(--danger)}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:16px}.kpi small{color:var(--muted);font-weight:700}.kpi strong{display:block;font-size:28px;margin:5px 0}.kpi span{font-size:12px;color:var(--muted)}
.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.section-title h3{margin:0;font-size:16px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#eef3f1;color:#42554f}.badge.ok{background:#e3f5ec;color:#176744}.badge.warn{background:#fff4dd;color:#8c5a00}.badge.danger{background:#fde9e9;color:#9a3232}.badge.brand{background:var(--soft);color:var(--brand)}
.priority{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #edf2ef}.priority:last-child{border-bottom:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);margin-top:6px;flex:none}.priority b{display:block;font-size:13px}.priority span{font-size:12px;color:var(--muted)}
.bar-row{display:grid;grid-template-columns:125px 1fr 35px;gap:9px;align-items:center;margin:9px 0;font-size:12px}.track{height:8px;background:#edf2ef;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fff}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:11px 12px;border-bottom:1px solid #edf2ef;text-align:left;font-size:13px}th{background:#f8faf9;color:#55645f;font-size:11px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfdfc}.link{color:var(--brand);font-weight:800;cursor:pointer}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters input,.filters select{border:1px solid var(--line);background:#fff;padding:9px 10px;border-radius:10px}
.empty{padding:28px;text-align:center;color:var(--muted)}.profile-head{background:linear-gradient(135deg,#103d33,#17785f);color:#fff;border-radius:17px;padding:20px;display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.profile-head h2{margin:0 0 5px}.profile-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.profile-meta span{background:rgba(255,255,255,.13);border-radius:999px;padding:5px 8px;font-size:12px}
.tabs{display:flex;gap:6px;overflow:auto;margin:14px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:9px}.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.skill{margin:10px 0}.skill-top{display:flex;justify-content:space-between;font-size:12px}.skill-dots{display:flex;gap:4px;margin-top:5px}.skill-dots i{height:7px;flex:1;border-radius:99px;background:#e7eeeb}.skill-dots i.on{background:var(--brand2)}
.timeline{position:relative;padding-left:24px}.timeline:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:#dce8e3}.event{position:relative;padding:0 0 16px}.event:before{content:"";position:absolute;left:-21px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px #e5f2ed}.event b{font-size:13px}.event div{font-size:12px;color:var(--muted);margin-top:3px}
.notice{padding:12px 13px;border-radius:11px;background:#fff9e9;border:1px solid #f0dfad;color:#73530b;font-size:12px}.privacy{background:#f1f4ff;border-color:#d9def9;color:#46508a}
progress{width:100%;accent-color:var(--brand)}canvas{width:100%;height:230px;border:1px solid var(--line);border-radius:12px;background:#fff}
dialog{width:min(720px,94vw);border:0;border-radius:16px;padding:0;box-shadow:0 30px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(12,30,25,.5)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0}.modal-body{padding:18px;max-height:70vh;overflow:auto}.modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:#586862;text-transform:uppercase;letter-spacing:.03em}.field input,.field select,.field textarea{border:1px solid var(--line);padding:10px;border-radius:9px;background:#fff}.field textarea{min-height:85px;resize:vertical}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.quick button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}.quick b{display:block}.quick span{font-size:11px;color:var(--muted)}
.score{font-size:30px;font-weight:900}.muted{color:var(--muted)}.small{font-size:12px}.pillbox{display:flex;gap:6px;flex-wrap:wrap}.lang-card{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.lang-card strong{font-size:20px;display:block}.print-only{display:none}
.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#173d34;color:#fff;border-radius:10px;padding:11px 14px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{height:auto;position:static;padding:10px}.brand{padding-bottom:8px}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.nav .sep,.aside-foot{display:none}.topbar{padding:10px}.content{padding:13px}.kpis,.three{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.page-head{flex-direction:column}.profile-head{flex-direction:column}.quick{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.kpis,.three,.quick{grid-template-columns:1fr}.topbar select{display:none}}
@media print{aside,.topbar,.actions,.tabs,.btn,.filters{display:none!important}.app{display:block}.content{padding:0}.card,.profile-head{box-shadow:none;break-inside:avoid}.print-only{display:block}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo">EAL</div><div><h1>EAL Progress Hub</h1><small>School progress tracker</small></div></div>
  <div class="nav" id="nav">
    <button data-view="dashboard" class="active">⌂ Dashboard</button>
    <button data-view="students">◎ Students</button>
    <button data-view="reading">▤ Reading Ages</button>
    <button data-view="assessments">◫ EAL Assessments</button>
    <button data-view="interventions">◇ Interventions</button>
    <button data-view="observations">◉ Observations</button>
    <button data-view="reviews">✓ Reviews</button>
    <button data-view="cohorts">▦ Cohorts</button>
    <button data-view="reports">▧ Reports</button>
    <div class="sep"></div>
    <button data-view="archive">⌁ Archive</button>
    <button data-view="settings">⚙ Settings & Privacy</button>
  </div>
  <div class="aside-foot">Demo mode stores information only in this browser. Use fictional data until a school-approved secure backend is connected.</div>
</aside>
<main>
  <div class="topbar">
    <div class="search"><input id="globalSearch" placeholder="Search students, languages, year groups…"></div>
    <select id="roleSelect" aria-label="Current role">
      <option>Administrator</option><option>EAL Coordinator</option><option>Teacher</option><option>Senior Leadership</option><option>Read only</option>
    </select>
    <button class="btn soft" id="privacyBtn">Privacy: Off</button>
  </div>
  <div class="content" id="content"></div>
</main>
</div>
<dialog id="modal"><div class="modal-head"><h3 id="modalTitle">Record</h3><button class="btn" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></dialog>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" hidden>
<script>
(function(){
"use strict";
var STORAGE="ealProgressHub.v1";
var skills=["listening","speaking","reading","writing","vocabulary","grammar","academic","classroom"];
var skillLabels={listening:"Listening",speaking:"Speaking",reading:"Reading",writing:"Writing",vocabulary:"Vocabulary",grammar:"Grammar",academic:"Academic language",classroom:"Classroom communication"};
var levels=["New to English","Early Acquisition","Developing Competence","Competent","Fluent"];
var state;
var ui={view:"dashboard",studentId:null,studentTab:"overview",studentFilter:"",yearFilter:"All",levelFilter:"All",privacy:false,role:"Administrator"};

function uid(prefix){return (prefix||"id")+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function iso(d){return new Date(d).toISOString().slice(0,10)}
function today(){return iso(new Date())}
function monthsBetween(a,b){var d1=new Date(a),d2=new Date(b);return Math.round((d2-d1)/2629800000)}
function ageMonths(dob,at){var d1=new Date(dob),d2=new Date(at||today());return Math.max(0,(d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth())-(d2.getDate()<d1.getDate()?1:0))}
function ageText(m){m=Number(m)||0;return Math.floor(m/12)+"y "+(m%12)+"m"}
function fullAgeText(m){m=Number(m)||0;return Math.floor(m/12)+" years "+(m%12)+" months"}
function dateText(v){if(!v)return"—";return new Date(v+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function roleCanEdit(){return ui.role==="Administrator"||ui.role==="EAL Coordinator"||ui.role==="Teacher"}
function roleCanAdmin(){return ui.role==="Administrator"||ui.role==="EAL Coordinator"}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200)}
function save(action){localStorage.setItem(STORAGE,JSON.stringify(state));if(action){state.audit.unshift({id:uid("audit"),date:new Date().toISOString(),user:ui.role,action:action});state.audit=state.audit.slice(0,200);localStorage.setItem(STORAGE,JSON.stringify(state))}}
function studentById(id){return state.students.find(function(s){return s.id===id})}
function latest(arr){return (arr||[]).slice().sort(function(a,b){return String(b.date||b.reviewDate||"").localeCompare(String(a.date||a.reviewDate||""))})[0]}
function levelFromSkills(obj){var sum=skills.reduce(function(a,k){return a+(Number(obj&&obj[k])||1)},0);var avg=sum/skills.length;return levels[Math.max(0,Math.min(4,Math.round(avg)-1))]}
function readingLatest(s){return latest(s.readingAssessments||[])}
function readingGap(s,a){a=a||readingLatest(s);if(!a)return null;return Number(a.readingMonths)-ageMonths(s.dob,a.date)}
function readingProgress(s){
 var arr=(s.readingAssessments||[]).slice().sort(function(a,b){return a.date.localeCompare(b.date)});
 if(arr.length<2)return null;var a=arr[arr.length-2],b=arr[arr.length-1],elapsed=Math.max(1,monthsBetween(a.date,b.date)),gain=Number(b.readingMonths)-Number(a.readingMonths);
 return {gain:gain,elapsed:elapsed,rate:gain/elapsed,a:a,b:b}
}
function reviewDue(s){return s.nextReview&&s.nextReview<=today()}
function readingDue(s){var r=readingLatest(s);return !r||monthsBetween(r.date,today())>=3}
function interventionDue(s){return (s.interventions||[]).some(function(i){return i.status!=="Completed"&&i.reviewDate&&i.reviewDate<=today()})}
function targetDue(s){return (s.targets||[]).some(function(t){return t.status!=="Completed"&&t.reviewDate&&t.reviewDate<=today()})}

function demo(){
 var mk=function(name,year,form,dob,lang,country,skillVals,reads){return {
   id:uid("stu"),name:name,preferredName:name.split(" ")[0],year:year,form:form,dob:dob,admissionDate:"2026-09-02",firstLanguage:lang,otherLanguages:[],country:country,ukEntry:"2024-09-01",previousSchooling:"Previous schooling discussed with family.",keyStaff:"EAL Team",strengths:"Positive attitude, visual learning and strong participation.",development:"Academic vocabulary and extended written responses.",notes:"Fictional demonstration record.",archived:false,nextReview:"2026-12-04",
   proficiency:{listening:skillVals[0],speaking:skillVals[1],reading:skillVals[2],writing:skillVals[3],vocabulary:skillVals[4],grammar:skillVals[5],academic:skillVals[6],classroom:skillVals[7]},
   readingAssessments:reads.map(function(r){return {id:uid("read"),date:r[0],test:"School reading assessment",readingMonths:r[1],standardScore:r[2],rawScore:"",assessor:"EAL Team",notes:""}}),
   targets:[{id:uid("tar"),category:"Academic language",text:"Use subject-specific vocabulary accurately in a structured paragraph.",dateSet:"2026-09-08",reviewDate:"2026-10-20",status:"Developing",evidence:"Classwork samples"}],
   interventions:[{id:uid("int"),name:"Academic vocabulary group",focus:"Tier 2 and Tier 3 vocabulary",startDate:"2026-09-10",endDate:"2026-12-01",reviewDate:"2026-10-22",frequency:"2 × 25 minutes weekly",staff:"EAL Team",baseline:"Needs prompts for unfamiliar academic terms.",target:"Use new vocabulary independently.",status:"Active",outcome:""}],
   observations:[{id:uid("obs"),date:"2026-09-16",subject:"Science",listening:"Usually independent",speaking:"Full sentences",reading:"Developing independence",writing:"Developing",strength:"Uses diagrams well to infer meaning.",difficulty:"Long command words and extended explanations.",support:"Pre-teach key vocabulary; sentence starters.",comment:"Engaged well in pair discussion."}],
   assessments:[{id:uid("ass"),date:"2026-09-08",skills:Object.assign({},function(){var o={};skills.forEach(function(k,i){o[k]=skillVals[i]});return o}()),assessor:"EAL Team",notes:"Baseline profile"}],
   reviews:[],studentVoice:{speaking:3,instructions:4,reading:3,writing:2,help:4,easiest:"Maths",hardest:"English",goal:"Write longer answers with confidence."},
   strategies:["Pre-teach essential vocabulary","Use visual examples and modelling","Give processing time before requesting an answer","Provide sentence starters for extended responses","Check understanding privately"],
   vocab:[{id:uid("voc"),term:"analyse",type:"Tier 2",subject:"Across curriculum",status:"Developing"},{id:uid("voc"),term:"evaluate",type:"Tier 2",subject:"Across curriculum",status:"Emerging"}],
   subjectProgress:{Science:"Developing",Maths:"Secure",English:"Developing",Humanities:"Developing"},evidence:[]
 }}
 return {
  settings:{schoolName:"Demo School",readingIntervalMonths:3,reviewInterval:"Termly",academicYear:"2026/27",hideSensitiveInTeacherView:true},
  students:[
   mk("Amina Rahman","Year 8","8A","2013-05-12","Bengali","Bangladesh",[4,3,3,3,3,3,2,4],[["2026-01-20",124,91],["2026-05-19",130,94],["2026-09-10",136,96]]),
   mk("Mateo Silva","Year 9","9B","2012-02-20","Portuguese","Brazil",[4,4,4,3,4,3,3,4],[["2026-02-14",137,97],["2026-06-18",143,99],["2026-09-12",147,101]]),
   mk("Yuna Park","Year 7","7C","2014-08-03","Korean","South Korea",[3,2,3,2,2,2,2,3],[["2026-05-23",118,89],["2026-09-09",123,91]]),
   mk("Omar Haddad","Year 10","10A","2011-01-14","Arabic","Jordan",[4,4,3,3,4,3,3,4],[["2026-03-11",139,90],["2026-06-17",145,93],["2026-09-14",149,94]]),
   mk("Sofia Marin","Year 11","11B","2010-06-22","Romanian","Romania",[5,4,4,4,4,4,4,5],[["2026-02-02",164,101],["2026-06-06",169,103],["2026-09-08",173,105]]),
   mk("Wei Chen","Year 8","8B","2013-10-09","Mandarin Chinese","China",[3,3,3,2,3,2,2,3],[["2026-01-13",120,88],["2026-05-15",126,90],["2026-09-11",130,92]])
  ],archive:[],audit:[{id:uid("audit"),date:new Date().toISOString(),user:"System",action:"Demo data created"}]
 }
}

function load(){try{var s=JSON.parse(localStorage.getItem(STORAGE));state=s&&s.students?s:demo()}catch(e){state=demo()}ui.role=localStorage.getItem("ealRole")||"Administrator";document.getElementById("roleSelect").value=ui.role}
function setView(v){ui.view=v;ui.studentId=null;document.querySelectorAll("#nav button").forEach(function(b){b.classList.toggle("active",b.dataset.view===v)});render()}
function pageHead(title,sub,actions){return '<div class="page-head"><div><h2>'+esc(title)+'</h2><p>'+esc(sub||"")+'</p></div><div class="actions">'+(actions||"")+'</div></div>'}
function badge(text,type){return '<span class="badge '+(type||"")+'">'+esc(text)+'</span>'}

function getPriorities(){
 var out=[];
 state.students.filter(function(s){return !s.archived}).forEach(function(s){
  if(readingDue(s))out.push({sev:"warn",name:s.name,text:"Reading-age reassessment is due",student:s.id});
  if(reviewDue(s))out.push({sev:"danger",name:s.name,text:"EAL review is overdue",student:s.id});
  if(interventionDue(s))out.push({sev:"warn",name:s.name,text:"Intervention review is due",student:s.id});
  if(targetDue(s))out.push({sev:"warn",name:s.name,text:"Target review is due",student:s.id});
  if(!(s.assessments||[]).length)out.push({sev:"danger",name:s.name,text:"No EAL assessment recorded",student:s.id})
 });
 return out
}
function currentStudents(){return state.students.filter(function(s){return !s.archived})}

function renderDashboard(){
 var ss=currentStudents(),prior=getPriorities(),langs={};ss.forEach(function(s){langs[s.firstLanguage]=(langs[s.firstLanguage]||0)+1});
 var due=ss.filter(readingDue).length,active=ss.reduce(function(n,s){return n+(s.interventions||[]).filter(function(i){return i.status!=="Completed"}).length},0);
 var strong=ss.filter(function(s){var p=readingProgress(s);return p&&p.rate>1.3}).length;
 var act='<button class="btn primary" onclick="openAddStudent()">+ Add student</button>';
 var html=pageHead("EAL Coordinator Dashboard","Whole-school overview for "+state.settings.academicYear,act);
 html+='<div class="grid kpis"><div class="card kpi"><small>EAL students</small><strong>'+ss.length+'</strong><span>Current register</span></div><div class="card kpi"><small>Reading reassessments</small><strong>'+due+'</strong><span>Due now / overdue</span></div><div class="card kpi"><small>Active interventions</small><strong>'+active+'</strong><span>Across all pupils</span></div><div class="card kpi"><small>Strong reading progress</small><strong>'+strong+'</strong><span>Above 1.3 months/month</span></div><div class="card kpi"><small>Languages</small><strong>'+Object.keys(langs).length+'</strong><span>First languages recorded</span></div></div>';
 html+='<div class="card" style="margin-bottom:14px"><div class="section-title"><h3>Quick actions</h3><span class="small muted">Designed for minimum staff workload</span></div><div class="quick">'+
 '<button onclick="openAddStudent()"><b>+ Add student</b><span>New admission/profile</span></button><button onclick="openQuickReading()"><b>▤ Reading age</b><span>Record an assessment</span></button><button onclick="openObservation()"><b>◉ Observation</b><span>Fast teacher entry</span></button><button onclick="openAssessment()"><b>◫ EAL assessment</b><span>8-domain profile</span></button>'+
 '<button onclick="openIntervention()"><b>◇ Intervention</b><span>Start or review support</span></button><button onclick="openTarget()"><b>✓ Target</b><span>Set a reviewable target</span></button><button onclick="setView(\'reports\')"><b>▧ Report</b><span>Individual or cohort</span></button><button onclick="setView(\'reviews\')"><b>⌁ Review</b><span>Termly review workflow</span></button></div></div>';
 html+='<div class="grid two"><div class="card"><div class="section-title"><h3>Coordinator priorities</h3>'+badge(prior.length+" items",prior.length?"warn":"ok")+'</div>';

window.exportBackup=function(){var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="eal-progress-backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href);toast("Backup downloaded")}

window.importCsv=function(){var f=document.getElementById("fileInput");f.accept=".csv";f.onchange=function(){var file=f.files[0];if(!file)return;var r=new FileReader();r.onload=function(){var lines=String(r.result).split(/\r?\n/).filter(Boolean);if(lines.length<2)return toast("No data rows found");var headers=lines[0].split(",").map(function(x){return x.replace(/^"|"$/g,"")});lines.slice(1).forEach(function(line){var vals=line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)||[];var o={};headers.forEach(function(h,i){o[h]=String(vals[i]||"").replace(/^"|"$/g,"").replace(/""/g,'"')});if(!o.name)return;var p={};skills.forEach(function(k){p[k]=2});state.students.push({id:uid("stu"),name:o.name,preferredName:o.name.split(" ")[0],year:o.year||"Year 7",form:o.form||"",dob:o.dob||"2013-01-01",admissionDate:today(),firstLanguage:o.firstLanguage||"",otherLanguages:[],country:o.country||"",ukEntry:o.ukEntry||"",previousSchooling:"",keyStaff:o.keyStaff||"EAL Team",strengths:"",development:"",notes:"Imported from CSV",archived:false,nextReview:"",proficiency:p,readingAssessments:[],targets:[],interventions:[],observations:[],assessments:[],reviews:[],studentVoice:{},strategies:["Pre-teach essential vocabulary","Use visual examples","Allow processing time"],vocab:[],subjectProgress:{},evidence:[]})});save("Imported students from CSV");render();toast("CSV import completed")};r.readAsText(file)};f.click()}
